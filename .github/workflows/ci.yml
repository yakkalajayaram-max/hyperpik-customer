name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Golden images are rendered on Windows; fonts differ on the Linux runner, so goldens are skipped here.
      - name: Run tests (skipped when the app has no test folder)
        run: if [ -d test ]; then flutter test --name '^(?!.*golden)'; else echo "no tests"; fi
